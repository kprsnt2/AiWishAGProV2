<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Knowledge Graph</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for robust markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Nexus</h2>
                <button id="btn-new-note" title="New Note"><i class="fas fa-edit"></i></button>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search notes...">
            </div>
            <ul id="note-list">
                <!-- Notes will be injected here -->
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Editor View -->
            <div id="editor-view" class="view-active">
                <div class="editor-header">
                    <input type="text" id="note-title" placeholder="Note Title...">
                    <button id="btn-toggle-graph" title="View Graph"><i class="fas fa-project-diagram"></i> Graph View</button>
                    <button id="btn-delete-note" title="Delete Note" class="danger"><i class="fas fa-trash"></i></button>
                </div>
                <div class="editor-body">
                    <div class="editor-pane">
                        <textarea id="note-content" placeholder="Start typing... Use [[Double Brackets]] to link to other notes."></textarea>
                    </div>
                    <div class="preview-pane">
                        <div id="note-preview" class="markdown-body"></div>
                        
                        <div class="backlinks-section">
                            <h3>Linked Mentions</h3>
                            <ul id="backlinks-list"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Graph View -->
            <div id="graph-view">
                <div class="graph-header">
                    <h2>Knowledge Graph</h2>
                    <button id="btn-close-graph"><i class="fas fa-times"></i> Close Graph</button>
                </div>
                <canvas id="graph-canvas"></canvas>
            </div>
        </main>
    </div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
